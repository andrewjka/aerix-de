# ═══════════════════════════════════════════════════════════
# KITTY — адаптация из config.ghostty
# ═══════════════════════════════════════════════════════════

# ── Тема ─────────────────────────────────────────────────────
# Сначала подключается палитра, потом переопределения ниже,
# так же как в Ghostty: background/foreground из конфига
# перекрывают значения темы.
# Для переключения на Mocha замените latte.conf на mocha.conf.
include themes/latte.conf

# ── Текст ────────────────────────────────────────────────────
font_family      JetBrains Mono
font_size        12.0

# ── Оформление ───────────────────────────────────────────────
# Отступы: top right bottom left (как window-padding-x/y = 8).
window_padding_width 8 8 8 8

# Прозрачность фона. Размытие делает Hyprland/HyprGlass,
# поэтому background_blur не задаём.
background_opacity 0.08

# ── Поведение, которого не было в Ghostty-конфиге ───────────
# Убираем системные рамки окна: Hyprland сам управляет окнами.
hide_window_decorations yes
# Не спрашивать подтверждение при закрытии окна.
confirm_os_window_close 0
# Выключить звуковой сигнал.
enable_audio_bell no
